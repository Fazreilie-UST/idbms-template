server {
    listen 80;
    server_name _;

    # Hide nginx version
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable client cap to limit upload-based DoS
    client_max_body_size 100m;

    # Security headers (redundant with backend headers but covers static assets too)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Cache hashed assets aggressively
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA fallback: serve index.html for client-side routes
    location / {
        try_files $uri /index.html;
    }

    # Don't expose dotfiles / source maps inadvertently
    location ~ /\. {
        deny all;
    }
}
