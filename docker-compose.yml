version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: fastraylee
      POSTGRES_PASSWORD: R0r0n0@
      POSTGRES_DB: idbms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: fastapi_app
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fastraylee:R0r0n0@db:5432/idbms
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379/0
      # Persist user-uploaded profile pictures on the host so they survive
      # container restarts / rebuilds. Path matches the bind mount below.
      - PROFILE_PICTURE_DIR=/app/profile-pictures
    volumes:
      - ./db/profile-pictures:/app/profile-pictures

  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "3000:80"
    environment:
      - API_URL=http://localhost:8000
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: pgadmin
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7-alpine
    container_name: idbms_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  postgres_data:
  pgadmin_data:
  redis_data: